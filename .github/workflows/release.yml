name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl gives one statically linked binary that runs on every glibc
          # vintage and every distro — Arch, Debian, Alpine, NixOS alike.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: false
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          # glibc builds for distros that prefer dynamic linking.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          # Both macOS targets build on Apple Silicon: Xcode's toolchain
          # cross-compiles to x86_64 natively, so the Intel build needs no
          # emulation and no Intel runner. GitHub is retiring `macos-13`, and
          # a retired image does not fail - it queues forever, holding the
          # whole release hostage behind one unschedulable job.
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            cross: false

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Only aarch64 needs a cross-compilation container; x86_64 musl builds
      # natively with musl-tools, which keeps `cargo install cross` (several
      # minutes) off the critical path.
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --workspace --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # `[ ... ] && x=y` returns 1 when the test is false, which under
          # `set -e` exits the step - on precisely the tag-push event this
          # workflow exists to serve. Use a real `if`.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.tag }}"
          else
            version="$GITHUB_REF_NAME"
          fi
          version="${version#v}"
          name="norupo-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/norupo" "dist/$name/"
          cp "target/${{ matrix.target }}/release/norupo-server" "dist/$name/"
          cp README.md LICENSE "dist/$name/"

          # Linux archives carry the systemd unit. norupo-bin installs it from
          # here, so without this that package declares a `backup=` file it
          # never ships - and anyone installing the prebuilt binaries to run an
          # edge server gets no unit at all. A systemd unit in a macOS archive
          # would just be noise, hence the guard.
          case "${{ matrix.target }}" in
            *linux*)
              mkdir -p "dist/$name/systemd"
              cp packaging/systemd/norupo-server.service \
                 packaging/systemd/server.env "dist/$name/systemd/"
              ;;
          esac
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # Checksums are what the AUR PKGBUILD and the install script verify.
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

          # Cross-compiled targets are worth checking: a misconfigured
          # --target silently produces a host-architecture binary that only
          # fails on the user's machine.
          if command -v file >/dev/null 2>&1; then
            file "dist/$name/norupo" "dist/$name/norupo-server"
          fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # `[ ... ] && x=y` returns 1 when the test is false, which under
          # `set -e` exits the step - on precisely the tag-push event this
          # workflow exists to serve. Use a real `if`.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.tag }}"
          else
            version="$GITHUB_REF_NAME"
          fi
          version="${version#v}"
          name="norupo-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/norupo.exe" "dist/$name/"
          cp "target/${{ matrix.target }}/release/norupo-server.exe" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          7z a "dist/$name.zip" "./dist/$name/*"
          certutil -hashfile "dist/$name.zip" SHA256 | sed -n 2p | tr -d ' \r' > "dist/$name.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: norupo-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  archlinux-package:
    name: Arch Linux package (.pkg.tar.zst)
    runs-on: ubuntu-latest
    needs: build
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        # makepkg refuses to run as root by design, and an unprivileged user
        # cannot let `makepkg -s` install makedepends through pacman. So the
        # dependencies go in here, as root, and makepkg runs without `-s`.
        # `rust` is the package that provides cargo on Arch; `rustup` does not.
        run: |
          pacman -Sy --noconfirm --needed git rust
          useradd -m builder
          chown -R builder:builder .

      - name: Build the package
        run: |
          su builder -c '
            set -eux
            cd packaging/aur/norupo-git
            makepkg -f --noconfirm --skipinteg
          '

      - uses: actions/upload-artifact@v7
        with:
          name: norupo-archlinux
          path: packaging/aur/norupo-git/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, archlinux-package]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release

          # Archives and the Arch package. The `-debug` package is build-id
          # symbols and is useless to anyone installing a release.
          find artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.pkg.tar.zst' \) \
            ! -name '*-debug-*' -exec cp {} release/ \;

          # One combined checksum file is friendlier than N single-line ones.
          # It must be generated BEFORE the sidecars are copied in, so that it
          # keeps covering archives only rather than hashing its own siblings.
          (cd release && sha256sum * > SHA256SUMS)

          # Both installers fetch `<asset>.sha256`. Without these they take
          # their "no published checksum" branch, which warns and installs
          # anyway - so a `curl | sh` would run an unverified binary despite
          # the release notes telling people to verify.
          find artifacts -type f -name '*.sha256' ! -name '*-debug-*' \
            -exec cp {} release/ \;

          ls -la release

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: release/*
          body: |
            ## Install

            **Arch Linux** (paru / yay)
            ```sh
            paru -S norupo-bin     # prebuilt
            paru -S norupo         # build from source
            ```

            **Arch Linux** (pacman repository — `pacman -S`, and upgrades with `pacman -Syu`)
            ```ini
            # /etc/pacman.conf
            [norupo]
            SigLevel = Required DatabaseOptional
            Server = https://github.com/${{ github.repository }}/releases/download/repo-$arch
            ```
            Trust the signing key first: see
            [Install](https://github.com/${{ github.repository }}#arch-linux-pacman-repository).

            **Arch Linux** (pacman, from the attached package)
            ```sh
            sudo pacman -U norupo-*.pkg.tar.zst
            ```

            **Linux / macOS** (any distro — the musl builds are static)
            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh
            ```

            **Windows** (PowerShell)
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex
            ```

            **From source** (any platform with Rust)
            ```sh
            cargo install --git https://github.com/${{ github.repository }} norupo-client norupo-server
            ```

            Verify a download against `SHA256SUMS` before running it.

  # `secrets` is not available in a job-level `if`, so the presence of the AUR
  # key has to be surfaced as a job output. Without this, every tagged release
  # goes red AFTER publishing successfully whenever the key is unset - which
  # teaches people to ignore a red release badge.
  aur-configured:
    name: Check AUR credentials
    runs-on: ubuntu-latest
    # Repository check only, deliberately. A fork has a different
    # `github.repository` and would not hold the secret anyway, so gating on
    # the event as well only stopped the maintainer from re-running their own
    # publish - which is the step most likely to fail transiently, and the one
    # whose only other recovery is inventing a version number.
    if: github.repository == 'Mahmoud-walid/Norupo-tunnel'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; skipping the AUR publish."
          fi

  aur:
    name: Publish to the AUR (${{ matrix.package }})
    runs-on: ubuntu-latest
    # Same image the package job already builds in. makepkg, updpkgsums and
    # --printsrcinfo all need a real Arch environment.
    container: archlinux:base-devel
    needs: [publish, aur-configured]
    if: needs.aur-configured.outputs.configured == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: [norupo, norupo-bin]

    steps:
      - uses: actions/checkout@v7

      - name: Install tooling
        # pacman-contrib provides updpkgsums.
        run: pacman -Sy --noconfirm --needed git openssh pacman-contrib

      # SSH setup and publish are ONE step on purpose. Written as two, the
      # `~/.ssh` files created by the first were not visible to the second -
      # HOME is not reliably the same across steps in a container job - and
      # git failed with "Host key verification failed" on a key that had just
      # been pinned successfully. Absolute paths and an explicit
      # GIT_SSH_COMMAND remove the dependency on HOME entirely.
      - name: Publish ${{ matrix.package }} to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          PKG: ${{ matrix.package }}
          # `github.ref_name` is the branch on a dispatch, not a tag, so it has
          # to resolve the same way the build and publish jobs do - otherwise a
          # dispatched run would try to publish a version called "main".
          REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          AUR_USERNAME: ${{ vars.AUR_USERNAME || 'norupo-ci' }}
          AUR_EMAIL: ${{ vars.AUR_EMAIL || 'ci@norupo.dev' }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"

          ssh_dir=/tmp/aur-ssh
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"

          # Pin the host key instead of trusting whatever answers on that
          # name. This key can push to the maintainer's whole AUR account, so
          # trust-on-first-use is not good enough: a hijacked DNS answer would
          # be handed a working credential.
          ssh-keyscan -t ed25519 aur.archlinux.org > "$ssh_dir/known_hosts" 2>/dev/null
          actual="$(ssh-keygen -lf "$ssh_dir/known_hosts" | awk '{print $2}')"
          expected="SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"
          if [ "$actual" != "$expected" ]; then
            echo "::error::AUR host key mismatch: got $actual, expected $expected"
            exit 1
          fi

          # StrictHostKeyChecking=yes is stated rather than assumed: if the
          # pinned known_hosts ever goes missing, this must fail loudly rather
          # than fall back to trust-on-first-use.
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o UserKnownHostsFile=$ssh_dir/known_hosts -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          bash packaging/aur/render.sh "$PKG" "$version"

          git config --global user.name "$AUR_USERNAME"
          git config --global user.email "$AUR_EMAIL"
          git config --global --add safe.directory '*'

          # Cloning a package that does not exist yet returns an empty
          # repository; the first push is what creates it on the AUR.
          git clone "ssh://aur@aur.archlinux.org/$PKG.git" aur
          cp "packaging/aur/$PKG/PKGBUILD" aur/PKGBUILD

          # makepkg refuses to run as root by design, and both updpkgsums and
          # --printsrcinfo go through it.
          useradd -m builder
          chown -R builder:builder aur
          su builder -c 'cd aur && updpkgsums && makepkg --printsrcinfo > .SRCINFO'

          cd aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "$PKG is already at $version on the AUR; nothing to push."
            exit 0
          fi

          echo "--- PKGBUILD ---"; cat PKGBUILD
          git commit -m "Update to $REF_NAME"
          # The AUR expects `master`; git may have named the local branch
          # something else, so be explicit rather than relying on the default.
          git push origin HEAD:refs/heads/master

  # Same job-output dance as `aur-configured`, and for the same reason:
  # `secrets` cannot be read from a job-level `if`.
  pacman-repo-configured:
    name: Check package signing key
    runs-on: ubuntu-latest
    if: github.repository == 'Mahmoud-walid/Norupo-tunnel'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          PACKAGE_GPG_PRIVATE_KEY: ${{ secrets.PACKAGE_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$PACKAGE_GPG_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PACKAGE_GPG_PRIVATE_KEY is not set; skipping the pacman repository publish."
          fi

  # A real pacman repository, so `pacman -S norupo-bin` works after one block
  # in /etc/pacman.conf and no AUR helper at all. The AUR cannot do this: it
  # serves PKGBUILDs, not a database, which is why `pacman -Ss` never finds an
  # AUR package.
  pacman-repo:
    name: Publish the pacman repository (${{ matrix.arch }})
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    needs: [publish, pacman-repo-configured]
    if: needs.pacman-repo-configured.outputs.configured == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]

    steps:
      - uses: actions/checkout@v7

      - name: Install tooling
        # pacman-contrib provides updpkgsums; repo-add ships with pacman.
        run: pacman -Sy --noconfirm --needed git gnupg pacman-contrib

      - name: Build and sign the repository
        env:
          PACKAGE_GPG_PRIVATE_KEY: ${{ secrets.PACKAGE_GPG_PRIVATE_KEY }}
          PACKAGE_GPG_PASSPHRASE: ${{ secrets.PACKAGE_GPG_PASSPHRASE }}
          ARCH: ${{ matrix.arch }}
          REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"

          export GNUPGHOME=/tmp/gnupg
          install -d -m 700 "$GNUPGHOME"
          # allow-loopback-pinentry covers a key that does carry a passphrase.
          # A CI signing key should not, but failing on pinentry inside a
          # container is a miserable way to find that out.
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          printf '%s\n' "$PACKAGE_GPG_PRIVATE_KEY" | gpg --batch --import
          keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "$keyid" ]; then
            echo "::error::no secret key found in PACKAGE_GPG_PRIVATE_KEY"
            exit 1
          fi
          echo "signing with $keyid"
          # Mark it ultimately trusted in this throwaway keyring so repo-add's
          # own verification pass (`-v`) accepts the signatures we just made.
          echo "$keyid:6:" | gpg --batch --import-ownertrust

          # Cross-building is a CARCH override and nothing more: norupo-bin
          # compiles nothing, it repackages the musl binaries this release
          # already published. Editing /etc/makepkg.conf rather than passing
          # --config keeps updpkgsums, which has no --config, on the same view.
          if [ "$ARCH" != "x86_64" ]; then
            sed -i -E "s/^CARCH=.*/CARCH=\"$ARCH\"/" /etc/makepkg.conf
            sed -i -E "s/^CHOST=.*/CHOST=\"$ARCH-unknown-linux-gnu\"/" /etc/makepkg.conf
          fi

          bash packaging/aur/render.sh norupo-bin "$version"

          useradd -m builder
          chown -R builder:builder .
          git config --global --add safe.directory '*'

          # makepkg refuses to run as root by design; updpkgsums goes through
          # it too. It downloads the release tarballs and pins their real
          # hashes, so a tampered asset fails the build rather than the user.
          su builder -c "
            set -eux
            cd packaging/aur/norupo-bin
            updpkgsums
            makepkg -f --noconfirm
          "

          mkdir -p repo
          cp packaging/aur/norupo-bin/*.pkg.tar.zst repo/
          cd repo

          # An array, not a `${x:+...}` expansion: that expands unquoted and
          # would split a passphrase containing a space into two arguments.
          gpg_args=(--batch --yes --pinentry-mode loopback)
          if [ -n "$PACKAGE_GPG_PASSPHRASE" ]; then
            gpg_args+=(--passphrase "$PACKAGE_GPG_PASSPHRASE")
          fi

          for pkg in *.pkg.tar.zst; do
            gpg "${gpg_args[@]}" --detach-sign --no-armor -u "$keyid" "$pkg"
          done

          # -s signs the database, -v verifies the package signatures made
          # above. Without -s a client running the documented
          # `SigLevel = Required` would reject the database outright.
          repo-add -s -v -k "$keyid" norupo.db.tar.gz ./*.pkg.tar.zst

          # repo-add leaves `norupo.db` as a symlink to the tarball. A GitHub
          # release asset cannot be a symlink, and `norupo.db` is the name
          # pacman actually fetches, so materialise both names as real files.
          for ext in db files; do
            cp -L "norupo.$ext.tar.gz" "norupo.$ext"
            # A real `if`: a false `[ ... ]` as the last statement in the loop
            # body makes the whole loop exit 1, which `set -e` turns into a
            # failed release.
            if [ -f "norupo.$ext.tar.gz.sig" ]; then
              cp -L "norupo.$ext.tar.gz.sig" "norupo.$ext.sig"
            fi
          done
          rm -f ./*.old ./*.old.sig

          ls -la

      - name: Publish the repository
        uses: softprops/action-gh-release@v3
        with:
          # `pacman` substitutes $arch in Server=, so one line in pacman.conf
          # covers both architectures.
          tag_name: repo-${{ matrix.arch }}
          name: pacman repository (${{ matrix.arch }})
          # Never `latest`: the install scripts and every README link resolve
          # the latest release, and a repository drop is not a release.
          prerelease: true
          make_latest: "false"
          files: repo/*
          body: |
            This is not a release. It is the `${{ matrix.arch }}` half of the
            Norupo pacman repository, republished on every tagged release.

            ```ini
            [norupo]
            SigLevel = Required DatabaseOptional
            Server = https://github.com/${{ github.repository }}/releases/download/repo-$arch
            ```

            See [Install](https://github.com/${{ github.repository }}#arch-linux-pacman-repository)
            for the key you must trust first.
