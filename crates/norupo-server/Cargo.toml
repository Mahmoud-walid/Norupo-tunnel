[package]
name = "norupo-server"
description = "Norupo edge server: gRPC control plane plus public HTTP/TCP ingress."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "norupo-server"

[features]
default = ["redis-registry"]
redis-registry = ["norupo-core/redis-registry"]

[[bin]]
name = "norupo-server"
path = "src/main.rs"

[dependencies]
norupo-core = { workspace = true }
norupo-proto = { workspace = true }
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
clap.workspace = true
dashmap.workspace = true
futures.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
toml.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
norupo-client = { path = "../norupo-client" }
http-body-util = { workspace = true }
bytes = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
norupo-core = { workspace = true }
